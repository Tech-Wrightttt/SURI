name: Commit Format

# Fails a PR if any of its commits break the format in .githooks/commit-msg.
# Commits made before the check was introduced are skipped.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CUTOFF_EPOCH: "1793205365" # 2026-10-28T16:36:05Z
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            [ "$(git log -1 --format=%ct "$c")" -lt "$CUTOFF_EPOCH" ] && continue
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Bad commit message in $(git log -1 --format='%h' "$c")"
              fail=1
            fi
          done
          exit $fail
